# TaskFlow API Gateway reverse proxy (Stage 1)
#
# Install:
#   sudo cp taskflow.conf /etc/nginx/sites-available/taskflow
#   sudo ln -sf /etc/nginx/sites-available/taskflow /etc/nginx/sites-enabled/taskflow
#   sudo nginx -t && sudo systemctl reload nginx
#
# Clients connect to http://127.0.0.1/ — nginx forwards to the gateway.

upstream taskflow_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://taskflow_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
}
